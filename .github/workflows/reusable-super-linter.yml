name: Super-Linter Reusable Workflow

on:
  workflow_call:
    inputs:
      validate-all-codebase:
        description: 'Validate all codebase or only changed files'
        required: false
        type: boolean
        default: true
      default-branch:
        description: 'The default branch name'
        required: false
        type: string
        default: 'main'
      linter-rules-path:
        description: 'Directory for linter configuration files'
        required: false
        type: string
        default: '.'
      filter-regex-exclude:
        description: 'Regular expression for excluding files/folders'
        required: false
        type: string
        default: ''

jobs:
  super-linter:
    name: Lint Code Base
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      statuses: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 0
      
      - name: Run Super-Linter
        uses: super-linter/super-linter@9e863354e3ff62e0727d37183162c4a88873df41 #v8.6.0
        env:
          VALIDATE_ALL_CODEBASE: ${{ inputs.validate-all-codebase }}
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINTER_RULES_PATH: ${{ inputs.linter-rules-path }}
          SAVE_SUPER_LINTER_SUMMARY: true
          FAIL_ON_CONFLICTING_TOOLS_ENABLED: true
          IGNORE_GENERATED_FILES: true
          IGNORE_GITIGNORED_FILES: true
          FILTER_REGEX_EXCLUDE: ${{ inputs.filter-regex-exclude }}
          # Shell
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_SHELL_SHFMT: true
          # Python
          VALIDATE_PYTHON_BLACK: true
          VALIDATE_PYTHON_ISORT: true
          VALIDATE_PYTHON_PYLINT: true
          VALIDATE_PYTHON_FLAKE8: true
          VALIDATE_PYTHON_MYPY: true
          # JavaScript/TypeScript
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_JAVASCRIPT_PRETTIER: true
          VALIDATE_TYPESCRIPT_ES: true
          VALIDATE_TYPESCRIPT_PRETTIER: true
          # CSS/HTML
          VALIDATE_CSS: true
          VALIDATE_CSS_PRETTIER: true
          VALIDATE_HTML: true
          VALIDATE_HTML_PRETTIER: true
          # JSON/YAML
          VALIDATE_JSON: true
          VALIDATE_JSON_PRETTIER: true
          VALIDATE_YAML: true
          VALIDATE_YAML_PRETTIER: true
          # Markdown
          VALIDATE_MARKDOWN: true
          VALIDATE_MARKDOWN_PRETTIER: true
          VALIDATE_NATURAL_LANGUAGE: true
          # GitHub Actions
          VALIDATE_GITHUB_ACTIONS: true
          # Security/Quality
          VALIDATE_GITLEAKS: true
          VALIDATE_GIT_MERGE_CONFLICT_MARKERS: true
          # Enable autofix for supported linters
          FIX_PYTHON_BLACK: true
          FIX_PYTHON_ISORT: true
          FIX_SHELL_SHFMT: true
          FIX_MARKDOWN: true
          FIX_MARKDOWN_PRETTIER: true
          FIX_YAML_PRETTIER: true
          FIX_JAVASCRIPT_PRETTIER: true
          FIX_CSS: true
          FIX_CSS_PRETTIER: true
          FIX_HTML_PRETTIER: true
          FIX_NATURAL_LANGUAGE: true
          FIX_JAVASCRIPT_ES: true
